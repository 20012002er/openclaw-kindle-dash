version: "3.8"

services:
  kindle-dash-server:
    build: .
    container_name: kindle-dash-server
    restart: unless-stopped
    # 使用 host 网络模式：容器直接共享宿主机网络栈，
    # 这样容器内 127.0.0.1 就是宿主机，可以直接访问宿主机上的 OpenClaw，
    # 无需 host.docker.internal 或端口映射。
    # 注意：host 模式下 ports 映射不生效，服务直接监听宿主机端口（由 PORT 环境变量决定，默认 3000）。
    network_mode: host
    env_file:
      - .env
    volumes:
      # 挂载到宿主机以便查看生成的 PNG。
      # 宿主机 ./public 目录必须存在且 node 用户(UID 1000) 有写权限。
      # 首次启动前请在宿主机执行：
      #   mkdir -p ./public ./data && chown -R 1000:1000 ./public ./data
      - ./public:/app/public
      # 挂载数据目录，持久化管理页面设置（模板选择、天气城市、Notion 配置等）
      - ./data:/app/data
